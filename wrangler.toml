# Aprova All Toral · Cloudflare Workers
name = "aprova-alltoral"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Páginas, estilos, stickers e ícones
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Banco de dados (clientes, peças, aprovações, artes e vídeos)
# Crie o banco "aprova" no painel do Cloudflare e cole o Database ID abaixo.
[[d1_databases]]
binding = "DB"
database_name = "aprova"
database_id = "ba61bdb2-7a09-40c9-80fb-5e956d996b61"

[observability]
enabled = true
