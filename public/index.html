<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div id="main"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="/app.js?v=20261001144209"></script>
<script src="/plan.js?v=20261001144209"></script>
<script>
if("serviceWorker" in navigator){
  /* quando sai versão nova, o app troca sozinho e recarrega uma vez */
  let had=!!navigator.serviceWorker.controller, done=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!done&&document.getElementById("sheet")?.hidden!==false){done=true;location.reload()}had=true});
  addEventListener("load",()=>navigator.serviceWorker.register("/sw.js",{updateViaCache:"none"}).then(r=>{setInterval(()=>r.update().catch(()=>{}),5*60*1000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update().catch(()=>{})})}).catch(()=>{}));
}
</script>
</body>
</html>
